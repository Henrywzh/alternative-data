name: Action Stores Weekly

on:
  schedule:
    # Monday 07:00 UTC — store counts are slow-moving, weekly is plenty.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date override (YYYY-MM-DD); blank = today"
        required: false
        default: ""

concurrency:
  group: action-stores-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-store-counts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Scrape Action store counts
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/scrape_action_stores.py --data-dir data $DATE_ARG

      - name: Commit store-count snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/action_stores || true

          if git diff --staged --quiet; then
            echo "No store-count changes to commit"
            exit 0
          fi

          git commit -m "chore: update Action store counts"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - name: Upload store-count dataset
        uses: actions/upload-artifact@v4
        with:
          name: action-stores-dataset
          path: data/processed/action_stores/
          if-no-files-found: error
