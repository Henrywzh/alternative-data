name: AI Hiring Demand Daily

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ai-hiring-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Collect public aggregate and ATS hiring sources
        run: python -m ai_hiring_data.cli --base-dir . daily-update

      - name: Run hiring-source quality tests
        run: python -m pytest -q tests/test_ai_hiring_data.py

      - name: Commit compact normalized datasets
        run: |
          if [ -z "$(git status --porcelain -- data/normalized/ai_hiring)" ]; then
            echo "No AI hiring dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/ai_hiring
          git commit -m "chore: update AI hiring demand [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Package raw responses for short-lived debugging
        if: always()
        run: |
          if [ -d data/raw/ai_hiring ]; then
            tar -czf "$RUNNER_TEMP/ai-hiring-raw.tar.gz" -C data/raw/ai_hiring .
          fi

      - name: Upload raw responses
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ai-hiring-raw
          path: ${{ runner.temp }}/ai-hiring-raw.tar.gz
          if-no-files-found: warn
          retention-days: 3
