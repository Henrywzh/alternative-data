name: AI News Signal Daily

on:
  schedule:
    - cron: "30 9 * * *" # Runs daily at 09:30 UTC, after AI News Daily (09:00 UTC) has landed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage-and-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run guard + engine triage and send daily brief
        run: |
          python -m src.ai_news_signal_data.cli --send-email

      - name: Commit signal datasets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/normalized/ai_news_signal || true

          if git diff --staged --quiet; then
            echo "No signal dataset changes to commit"
            exit 0
          fi

          git commit -m "chore: update AI news signal guard/brief datasets"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
