name: Asia Markets Dashboard Data Refresh Daily

# LIMITATION (read before touching schedule/steps):
# This workflow only runs the LIVE DATA half of `npm run build` for
# apps/asia-markets-dashboard/ — i.e. `npm run refresh`, which runs
# scripts/build_hk_real_estate_artifact.py and
# scripts/build_hk_local_consumer_artifact.py and commits the refreshed
# .generated/*.json artifact manifests + src/data/dashboard-status*.json.
#
# It deliberately does NOT run scripts/build-static-hub.mjs or
# scripts/package-dashboard.mjs. The packaging step calls an external tool
# (deliver_portable_artifact.mjs) that lives under a local Claude Code/Codex
# plugin cache (${CODEX_HOME:-~/.codex}/plugins/cache/openai-curated-remote/
# data-analytics/*/skills/build-report/scripts/) — a proprietary plugin
# bundle fetched through OpenAI's Codex plugin marketplace, not a published
# npm package. Investigation found the bundle itself is pure Node (no
# node_modules needed at runtime — mcp/server.cjs only requires node
# built-ins) and only needs a Chromium *headless-shell* binary resolvable
# via CHROMIUM_EXECUTABLE_PATH / PLAYWRIGHT_BROWSERS_PATH, which a CI runner
# could plausibly provide via `npx playwright install chromium`. The actual
# blocker is distribution: there is no public registry entry to fetch this
# exact plugin version from in a generic GitHub Actions runner, and vendoring
# OpenAI's bundled proprietary plugin code into this repo isn't appropriate.
#
# Net effect: the .generated/*.html portable dashboards (and the -zh.html
# localized variants, which still require package-dashboard.mjs) are NOT
# refreshed by this workflow. The underlying JSON data, status files, and
# localized -zh.json snapshots ARE kept fresh daily. Run `npm run build` locally
# (where the plugin cache exists) periodically to refresh the rendered HTML.

on:
  schedule:
    # 06:15 UTC daily — after most upstream sources (CenStatD, RVD, SGE gold
    # fixings, akshare-backed feeds) have published for the prior day/period.
    # All underlying pipelines tolerate staleness up to max_age_days=400, so
    # daily is a comfortable cadence, not a strict requirement — it just keeps
    # the fast-moving series (daily gold fixings, weekly CCL/MHPI) current
    # without over-hitting the live source endpoints.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: asia-markets-dashboard-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/asia-markets-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install PDF text extraction tooling
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Test artifact refresh guard
        working-directory: apps/asia-markets-dashboard
        run: npm run test:refresh-guard

      - name: Refresh HK Real Estate + HK Local Consumer artifacts
        # A single upstream publisher must not block the other sector
        # refreshes. The builder keeps the last committed artifact for the
        # failed sector and reports the failure in the job log; successful
        # sectors continue to produce fresh manifests and status files.
        #
        # Midland's data is refreshed by a separate, independently-scheduled
        # weekly automation outside this repo's CI — this workflow does not
        # need to (and deliberately does not) touch it. HK_RE_SKIP_MIDLAND
        # skips that fetch outright here rather than attempting a redundant
        # scrape. This also happens to route around a real WAF block on
        # GitHub Actions' datacenter IP range (confirmed 403; the same
        # fetch succeeds from a residential IP with no code change), but
        # that is no longer the primary reason to skip it.
        env:
          HK_RE_SKIP_MIDLAND: "1"
        run: npm run refresh -- --tolerate-errors

      - name: Refresh localized dashboard artifact JSON
        # This does not require the proprietary portable renderer. Keeping the
        # JSON snapshots in sync prevents the public ZH data view from serving
        # an older vintage than the EN view after the daily refresh.
        run: npm run localize

      - name: Commit refreshed artifact manifests and status files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the complete set of durable outputs that the artifact
          # builders can update. The dashboard builders are intentionally
          # allowed to refresh append-only source histories as well as the
          # published artifact/status files. Staging only artifact globs leaves
          # those source histories unstaged, so the retrying git pull --rebase
          # below fails with "You have unstaged changes" after the commit.
          # Keep disposable per-run caches ignored; these paths are the
          # committed dashboard outputs and durable source histories.
          git add \
            apps/asia-markets-dashboard/.generated/ \
            apps/asia-markets-dashboard/src/data/ \
            data/normalized/hk_commercial_aerospace/ \
            data/normalized/hk_population_migration/mpfa_departure_claims/20260801_mpfa_cached_v2/ \
            data/normalized/hk_local_consumer/afcd_category_history.csv \
            data/normalized/hk_local_consumer/consumer_council_oilprice_history.csv

          if git diff --staged --quiet; then
            echo "No dashboard data changes to commit"
            exit 0
          fi

          git commit -m "chore(dashboard): refresh all sector data [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
