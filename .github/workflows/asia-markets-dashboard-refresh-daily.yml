name: Asia Markets Dashboard Data Refresh Daily

# LIMITATION (read before touching schedule/steps):
# This workflow only runs the LIVE DATA half of `npm run build` for
# apps/asia-markets-dashboard/ — i.e. `npm run refresh`, which runs every
# live-sector artifact builder listed in sectors.json (real estate, local
# consumer, utilities, transport, telecom, labour, REIT, aerospace,
# stablecoin/crypto, population/migration) and commits the refreshed
# .generated/*.json artifact manifests + src/data/dashboard-status*.json.
#
# It deliberately does NOT run scripts/build-static-hub.mjs or the portable
# HTML mode of scripts/package-dashboard.mjs. The packaging step calls an external tool
# (deliver_portable_artifact.mjs) that lives under a local Claude Code/Codex
# plugin cache (${CODEX_HOME:-~/.codex}/plugins/cache/openai-curated-remote/
# data-analytics/*/skills/build-report/scripts/) — a proprietary plugin
# bundle fetched through OpenAI's Codex plugin marketplace, not a published
# npm package. Investigation found the bundle itself is pure Node (no
# node_modules needed at runtime — mcp/server.cjs only requires node
# built-ins) and only needs a Chromium *headless-shell* binary resolvable
# via CHROMIUM_EXECUTABLE_PATH / PLAYWRIGHT_BROWSERS_PATH, which a CI runner
# could plausibly provide via `npx playwright install chromium`. The actual
# blocker is distribution: there is no public registry entry to fetch this
# exact plugin version from in a generic GitHub Actions runner, and vendoring
# OpenAI's bundled proprietary plugin code into this repo isn't appropriate.
#
# Net effect: the portable HTML dashboards are not refreshed here. The
# Streamlit-facing EN artifacts, ZH artifacts (via --localize-only), freshness
# report and status files are kept in sync. Run `npm run build` locally (where
# the plugin cache exists) when the separate static HTML surface must refresh.

on:
  schedule:
    # 06:15 UTC daily — after most upstream sources (CenStatD, RVD, SGE gold
    # fixings, akshare-backed feeds) have published for the prior day/period.
    # All underlying pipelines tolerate staleness up to max_age_days=400, so
    # daily is a comfortable cadence, not a strict requirement — it just keeps
    # the fast-moving series (daily gold fixings, weekly CCL/MHPI) current
    # without over-hitting the live source endpoints.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: asia-markets-dashboard-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  refresh-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/asia-markets-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install PDF text extraction tooling
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Test artifact refresh guard
        working-directory: apps/asia-markets-dashboard
        run: npm run test:refresh-guard

      - name: Refresh current-year Buildings Department history
        id: bd_history
        working-directory: .
        run: |
          if python -m hk_real_estate.cli run-bd-history-current-year; then
            echo "producer_outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "producer_outcome=failure" >> "$GITHUB_OUTPUT"
            echo "::warning::BD current-year refresh failed; builder will retain and mark the last good history"
          fi

      - name: Ingest HK Local Consumer source data
        id: local_consumer_ingest
        working-directory: .
        run: |
          # The artifact builder is intentionally read-only and consumes the
          # latest normalized source run. A clean GitHub runner has no
          # gitignored normalized cache, so ingestion must happen first or the
          # refresh guard can only retain yesterday's artifact.
          if hk-local-consumer-data run-stage-1 --strict; then
            echo "producer_outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "producer_outcome=failure" >> "$GITHUB_OUTPUT"
            echo "::warning::one or more local-consumer sources failed; refresh guard will preserve the last complete artifact"
          fi

      - name: Refresh HK Real Estate + HK Local Consumer artifacts
        id: sector_builders
        # A single upstream publisher must not block the other sector
        # refreshes. The builder keeps the last committed artifact for the
        # failed sector and reports the failure in the job log; successful
        # sectors continue to produce fresh manifests and status files.
        #
        # Midland's data is refreshed by a separate, independently-scheduled
        # weekly automation outside this repo's CI — this workflow does not
        # need to (and deliberately does not) touch it. HK_RE_SKIP_MIDLAND
        # skips that fetch outright here rather than attempting a redundant
        # scrape. This also happens to route around a real WAF block on
        # GitHub Actions' datacenter IP range (confirmed 403; the same
        # fetch succeeds from a residential IP with no code change), but
        # that is no longer the primary reason to skip it.
        env:
          HK_RE_SKIP_MIDLAND: "1"
        run: |
          set -o pipefail
          log_path="$RUNNER_TEMP/asia-market-sector-builders.log"
          npm run refresh -- --tolerate-errors 2>&1 | tee "$log_path"
          if grep -q '^\[run-artifact-builders\].*\(exited with code\|timed out after\)' "$log_path"; then
            echo "producer_outcome=failure" >> "$GITHUB_OUTPUT"
          else
            echo "producer_outcome=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Localize Streamlit-facing artifacts
        run: node scripts/package-dashboard.mjs --localize-only

      - name: Write machine-readable freshness report
        working-directory: .
        run: python scripts/audit_asia_markets_freshness.py --report-only

      - name: Commit refreshed artifact manifests and status files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the complete set of durable outputs that the artifact
          # builders can update. The dashboard builders are intentionally
          # allowed to refresh append-only source histories as well as the
          # published artifact/status files. Staging only artifact globs leaves
          # those source histories unstaged, so the retrying git pull --rebase
          # below fails with "You have unstaged changes" after the commit.
          # Keep disposable per-run caches ignored; these paths are the
          # committed dashboard outputs and durable source histories.
          # The population artifact builder is fetch-first: a successful MPFA
          # fetch is merged with and persisted back to the whitelisted cache
          # directory, so the merged quarter history rides along with each
          # daily run.
          git add \
            apps/asia-markets-dashboard/.generated/ \
            apps/asia-markets-dashboard/src/data/ \
            data/normalized/hk_commercial_aerospace/ \
            data/normalized/hk_population_migration/mpfa_departure_claims/20260801_mpfa_cached_v2/ \
            data/normalized/hk_local_consumer/afcd_category_history.csv \
            data/normalized/hk_local_consumer/consumer_council_oilprice_history.csv

          if git diff --staged --quiet; then
            echo "No dashboard data changes to commit"
            exit 0
          fi

          git commit -m "chore(dashboard): refresh all sector data [$(date -u +%Y-%m-%d)]"

          # Sector-specific workflows (transport, labour, stablecoin, aerospace)
          # and this daily refresh both regenerate the same .generated
          # artifacts. When two runs overlap, a plain rebase cannot resolve the
          # conflicting regenerated JSON. -X theirs prefers THIS run's freshly
          # rebuilt artifacts on conflicting hunks; non-conflicting upstream
          # changes still merge normally.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Enforce source-observation freshness
        if: always()
        working-directory: .
        run: |
          python scripts/audit_asia_markets_freshness.py \
            --output /tmp/asia-markets-freshness-final.json

      - name: Fetch previous Phase 0 baseline
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ops/fetch_baseline.py \
            --artifact-prefix ops-shadow-asia-markets-dashboard-refresh- \
            --output /tmp/ops-baseline-asia-markets-dashboard-refresh.json

      - name: Emit Phase 0 shadow run report
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          OPS_JOB_STATUS: ${{ job.status }}
          OPS_INCIDENT_REPO: ${{ secrets.OPS_INCIDENT_REPO }}
          OPS_INCIDENT_TOKEN: ${{ secrets.OPS_INCIDENT_TOKEN }}
        run: |
          python scripts/ops/finalize_pipeline.py \
            --pipeline-id asia-markets-dashboard-refresh \
            --job-id refresh-dashboard-data \
            --execution "$OPS_JOB_STATUS" \
            --producer-outcome "bd-history=${{ steps.bd_history.outputs.producer_outcome }}" \
            --producer-outcome "local-consumer-ingest=${{ steps.local_consumer_ingest.outputs.producer_outcome }}" \
            --producer-outcome "sector-builders=${{ steps.sector_builders.outputs.producer_outcome }}" \
            --baseline-report /tmp/ops-baseline-asia-markets-dashboard-refresh.json \
            --output artifacts/ops/asia-markets-dashboard-refresh/run-report.json \
            --evidence-output artifacts/ops/asia-markets-dashboard-refresh/evidence-manifest.json

      - name: Ensure Phase 0 fallback telemetry exists
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OPS_PIPELINE_ID: asia-markets-dashboard-refresh
          OPS_JOB_ID: refresh-dashboard-data
          OPS_JOB_STATUS: ${{ job.status }}
          OPS_REPORT_PATH: artifacts/ops/asia-markets-dashboard-refresh/run-report.json
          OPS_EVIDENCE_PATH: artifacts/ops/asia-markets-dashboard-refresh/evidence-manifest.json
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const reportPath = process.env.OPS_REPORT_PATH;
            const observedAt = new Date().toISOString();
            const runId = process.env.GITHUB_RUN_ID || `fallback-${observedAt}`;
            const runUrl = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY
              ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}` : null;
            const allowed = new Set(["success", "failure", "cancelled"]);
            const execution = allowed.has(process.env.OPS_JOB_STATUS) ? process.env.OPS_JOB_STATUS : "unknown";
            const message = "Repository finalizer was unavailable; emitted runner-level fallback telemetry.";
            const required = ["pipeline_id", "job_id", "run_id", "finished_at", "execution",
              "collection", "data_health", "publication", "evidence_quality", "derived_state",
              "checks", "outputs", "evidence"];
            let report = null;
            try {
              const candidate = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              if (candidate.schema_version !== 1 || candidate.shadow !== true
                  || required.some((key) => !(key in candidate))
                  || !Array.isArray(candidate.checks) || !Array.isArray(candidate.outputs)
                  || !Array.isArray(candidate.evidence)) throw new Error("invalid run report");
              report = candidate;
            } catch {}
            if (!report) {
              const evidence = [{kind: "finalizer-error", path: null, observed_at: observedAt,
                description: message, run_url: runUrl, commit_sha: process.env.GITHUB_SHA || "unknown",
                check_id: "ops-shadow-finalizer", references: runUrl ? [runUrl] : []}];
              report = {
                schema_version: 1, pipeline_id: process.env.OPS_PIPELINE_ID,
                job_id: process.env.OPS_JOB_ID, workflow: process.env.GITHUB_WORKFLOW || "unknown",
                run_id: runId, run_attempt: Math.max(Number(process.env.GITHUB_RUN_ATTEMPT) || 1, 1),
                commit_sha: process.env.GITHUB_SHA || "unknown", started_at: null,
                finished_at: observedAt, execution, collection: "unknown", data_health: "unknown",
                publication: "failed", evidence_quality: "incomplete",
                derived_state: "UNKNOWN_EVIDENCE",
                checks: [{check_id: "ops-shadow-finalizer", status: "unknown", required: true,
                  message, expected: null, observed: null, details: {}}],
                outputs: [], evidence, shadow: true
              };
              fs.mkdirSync(path.dirname(reportPath), {recursive: true});
              fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + "\n");
            }
            const manifest = {version: 1, pipeline_id: report.pipeline_id, job_id: report.job_id,
              run_id: report.run_id, run_url: runUrl, commit_sha: report.commit_sha,
              observed_at: report.finished_at, evidence: report.evidence};
            let manifestValid = false;
            try {
              const existing = JSON.parse(fs.readFileSync(process.env.OPS_EVIDENCE_PATH, "utf8"));
              manifestValid = existing.version === 1 && existing.pipeline_id === report.pipeline_id
                && existing.job_id === report.job_id && existing.run_id === report.run_id
                && Array.isArray(existing.evidence);
            } catch {}
            if (!manifestValid) {
              fs.mkdirSync(path.dirname(process.env.OPS_EVIDENCE_PATH), {recursive: true});
              fs.writeFileSync(process.env.OPS_EVIDENCE_PATH, JSON.stringify(manifest, null, 2) + "\n");
            }

      - name: Upload Phase 0 shadow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ops-shadow-asia-markets-dashboard-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ops/asia-markets-dashboard-refresh/
          if-no-files-found: warn
          retention-days: 30
