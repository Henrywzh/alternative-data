name: China Macro Daily Refresh

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch full official histories instead of a recent revision window
        type: boolean
        default: false

concurrency:
  group: asia-markets-dashboard-artifacts-${{ github.ref }}
  queue: max

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Offline regression tests
        run: python -m pytest tests/china_macro -q
      - name: Refresh sources and publish local artifacts
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python -m china_macro.cli --backfill
          else
            python -m china_macro.cli
          fi
      - name: Commit China macro data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/normalized/china_macro apps/asia-markets-dashboard/.generated/china-macro-artifact.json apps/asia-markets-dashboard/.generated/china-macro-artifact-zh.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(china-macro): refresh source-backed history'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
          done
          exit 1
