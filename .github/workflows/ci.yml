name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Compile Python sources
        run: python -m compileall -q src dashboard

      - name: Run test suite
        env:
          DATA_SOURCE: local
        run: pytest -q -n auto

      - name: Smoke-test Streamlit startup
        env:
          DATA_SOURCE: local
        run: |
          streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
