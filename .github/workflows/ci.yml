name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs offline (tests/conftest.py blocks outbound connections;
    # the 31 tests that verify live endpoints are marked @pytest.mark.network
    # and skipped without --run-network). That removed the live-site fetches
    # that used to dominate the critical path -- ~10.5 minutes down to ~1.5 --
    # and, more importantly, the fetches were rewriting the gitignored captures
    # under data/raw/ that other tests read, so the same commit could pass or
    # fail depending on how xdist distributed the run. The live endpoints are
    # exercised for real by the daily data workflows.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install PDF text extraction tooling
        # MPFA's quarterly-digest parser intentionally uses Poppler's
        # pdftotext for stable table layout extraction. The GitHub-hosted
        # runner does not guarantee that binary is preinstalled.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Compile Python sources
        run: python -m compileall -q src dashboard

      - name: Run test suite
        env:
          DATA_SOURCE: local
        run: pytest -q -n auto

      - name: Smoke-test Streamlit startup
        env:
          DATA_SOURCE: local
        run: |
          streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
