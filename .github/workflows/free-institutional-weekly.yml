name: Free Institutional Data Weekly

# FactSet Earnings Insight publishes weekly, so a daily job would re-scrape
# the same PDF six times to find nothing. The lane walks no date range: it
# reads whatever the topic page currently links and upserts by report_date.

on:
  schedule:
    - cron: "40 5 * * 1"        # Mondays 05:40 UTC, after the weekly publication
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source list (default: factset)"
        required: false
        default: ""
      full_backfill:
        description: "Ignore stored coverage and refetch from 2019"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: free-institutional-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh weekly institutional lanes
        id: refresh
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
          FULL_BACKFILL: ${{ github.event.inputs.full_backfill }}
        run: |
          set -euo pipefail
          ARGS=""
          for source in ${SOURCES:-factset}; do
            ARGS="$ARGS --source $source"
          done
          # --resume unless the operator explicitly asked to refetch history.
          if [ "${FULL_BACKFILL:-false}" != "true" ]; then
            ARGS="$ARGS --resume"
          fi
          # shellcheck disable=SC2086
          python scripts/backfill_free_institutional_data.py $ARGS

      - name: Commit refreshed datasets
        run: |
          bash scripts/ci/commit_dataset_paths.sh \
            "chore: refresh weekly institutional lanes [$(date -u +%Y-%m-%d)]" \
            data/normalized/factset_earnings
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # Freshness is checked against the artifact, not the step outcome: a lane
      # whose fetch quietly stopped returning rows leaves a complete, valid,
      # stale dataset behind and the job still reports success.
      - name: Emit shadow run report
        if: always()
        continue-on-error: true
        env:
          OPS_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/ops/finalize_pipeline.py \
            --pipeline-id free-institutional-weekly \
            --job-id refresh \
            --execution "$OPS_JOB_STATUS" \
            --output artifacts/ops/free-institutional-weekly/run-report.json \
            --evidence-output artifacts/ops/free-institutional-weekly/evidence-manifest.json

      - name: Upload run report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ops-shadow-free-institutional-weekly-${{ github.run_id }}
          path: artifacts/ops/free-institutional-weekly/
          if-no-files-found: warn
