name: Global News Daily Update

on:
  schedule:
    - cron: "0 4 * * *"        # 04:00 UTC daily
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run daily update
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: |
          python -m global_news_data.cli --data-dir . --limit 10

      - name: Commit normalized datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/normalized/global_news/*.parquet

          if git diff --cached --quiet; then
            echo "No news data changes to commit"
            exit 0
          fi

          git commit -m "chore: update global news datasets [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Upload normalized datasets
        uses: actions/upload-artifact@v4
        with:
          name: global-news-data
          path: data/normalized/global_news/
          if-no-files-found: warn
