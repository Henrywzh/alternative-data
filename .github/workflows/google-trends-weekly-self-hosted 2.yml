name: Google Trends Weekly (Self-Hosted)

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: false
        default: "refresh-enabled"
        type: choice
        options:
          - refresh-enabled
          - refresh-ticker
          - validate
      ticker:
        description: "Ticker for refresh-ticker"
        required: false
        default: ""
      headful:
        description: "Show browser window for manual debugging"
        required: false
        default: false
        type: boolean
      timeframe:
        description: "Google Trends timeframe"
        required: false
        default: "today 5-y"
      stock_period:
        description: "yfinance period for stock history"
        required: false
        default: "5y"

permissions:
  contents: write

jobs:
  google-trends-watchlist:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      GOOGLE_TRENDS_PROFILE_DIR: ${{ vars.GOOGLE_TRENDS_PROFILE_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m playwright install chromium

      - name: Prepare runtime directories
        run: |
          PROFILE_DIR="${GOOGLE_TRENDS_PROFILE_DIR:-$HOME/.cache/google-trends-playwright}"
          echo "GOOGLE_TRENDS_PROFILE_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROFILE_DIR"
          mkdir -p output/google_trends_downloads

      - name: Validate seeded browser profile
        run: |
          if [ ! -d "$GOOGLE_TRENDS_PROFILE_DIR" ]; then
            echo "Missing Google Trends browser profile directory: $GOOGLE_TRENDS_PROFILE_DIR"
            exit 1
          fi
          echo "Using Google Trends browser profile: $GOOGLE_TRENDS_PROFILE_DIR"

      - name: Run scheduled watchlist refresh
        if: github.event_name == 'schedule'
        run: |
          python -m google_trends_data.batch_cli refresh-enabled \
            --base-dir . \
            --timeframe "today 5-y" \
            --stock-period "5y"

      - name: Run manual refresh-enabled
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'refresh-enabled'
        run: |
          HEADFUL_ARG=""
          if [ "${{ github.event.inputs.headful }}" = "true" ]; then
            HEADFUL_ARG="--headful"
          fi
          python -m google_trends_data.batch_cli refresh-enabled \
            --base-dir . \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --stock-period "${{ github.event.inputs.stock_period }}" \
            $HEADFUL_ARG

      - name: Run manual refresh-ticker
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'refresh-ticker'
        run: |
          if [ -z "${{ github.event.inputs.ticker }}" ]; then
            echo "ticker input is required for refresh-ticker"
            exit 1
          fi
          HEADFUL_ARG=""
          if [ "${{ github.event.inputs.headful }}" = "true" ]; then
            HEADFUL_ARG="--headful"
          fi
          python -m google_trends_data.batch_cli refresh-ticker \
            --base-dir . \
            --ticker "${{ github.event.inputs.ticker }}" \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --stock-period "${{ github.event.inputs.stock_period }}" \
            $HEADFUL_ARG

      - name: Run manual validate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'validate'
        run: |
          HEADFUL_ARG=""
          if [ "${{ github.event.inputs.headful }}" = "true" ]; then
            HEADFUL_ARG="--headful"
          fi
          python -m google_trends_data.batch_cli validate \
            --base-dir . \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            $HEADFUL_ARG

      - name: Commit Google Trends datasets
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.command != 'validate')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/google_trends data/processed/google_trends

          if git diff --staged --quiet; then
            echo "No Google Trends dataset changes to commit"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: refresh Google Trends watchlist datasets"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - name: Upload downloaded CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-trends-csv-downloads
          path: output/google_trends_downloads/
          if-no-files-found: warn

      - name: Upload processed datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-trends-processed-datasets
          path: data/processed/google_trends/
          if-no-files-found: warn
