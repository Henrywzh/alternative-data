# GPU rental prices for the AI data dashboard's GPU page: GetDeploying weekly
# (rolling year, retained here as it rolls off), R. Mittal's monthly history
# and Compute Screener's daily index. Each source is validated before it is
# written; a failed source keeps its last good table and fails the job after
# the others are committed.
name: GPU Price History Daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh GPU prices
        id: refresh
        continue-on-error: true
        run: python -m gpu_prices.cli --base-dir .

      - name: Commit normalized datasets
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/gpu_price_history/*.parquet data/normalized/gpu_price_history/latest_run.json
          if git diff --cached --quiet; then
            echo "No GPU price changes to commit"
          else
            git commit -m "chore: update GPU rental price history [$(date -u +%Y-%m-%d)]"
            for attempt in 1 2 3; do
              if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
                echo "Pushed on attempt ${attempt}"
                break
              fi
              if [ "$attempt" = 3 ]; then echo "Failed to push after 3 attempts"; exit 1; fi
              sleep 5
            done
          fi

      - name: Fail if a source failed
        if: steps.refresh.outcome == 'failure'
        run: |
          cat data/normalized/gpu_price_history/latest_run.json
          exit 1
