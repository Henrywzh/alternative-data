name: HK Commercial Aerospace Sector Data Refresh Weekly

# HK Commercial Aerospace data sources: SSE/SZSE IPO status, Launch Library 2,
# Celestrak NORAD orbit data, FAA commercial-space KPIs, USAspending contracts,
# SEC company filings, the global benchmark, Google Patents search, and daily
# Wikimedia Pageviews aggregated to complete weekly attention totals.
# Weekly cadence (Mondays 02:00 UTC) ensures Launch Library 2 15-req/hour limit
# is respected while keeping status, satellite counts, contracts, filings, and
# the persistent launch/constellation histories fresh.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: hk-aerospace-weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-hk-aerospace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Build HK Commercial Aerospace artifact
        working-directory: apps/asia-markets-dashboard
        run: |
          python3 scripts/build_hk_commercial_aerospace_artifact.py \
            --output .generated/hk-commercial-aerospace-artifact.json \
            --status-output src/data/dashboard-status-hk-commercial-aerospace.json

      - name: Localize Streamlit-facing artifact
        working-directory: apps/asia-markets-dashboard
        run: node scripts/package-dashboard.mjs --localize-only --sector hk-commercial-aerospace

      - name: Write freshness report
        run: python scripts/audit_asia_markets_freshness.py --report-only

      - name: Commit refreshed aerospace data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Builders also persist append-only launch history, SATCAT monthly
          # summaries, and their manifests. Stage all tracked outputs in the
          # aerospace data directory so an omitted generated file cannot leave
          # the checkout dirty and make the subsequent pull --rebase fail.
          git add \
            apps/asia-markets-dashboard/.generated/hk-commercial-aerospace-artifact.json \
            apps/asia-markets-dashboard/.generated/hk-commercial-aerospace-artifact-zh.json \
            apps/asia-markets-dashboard/.generated/asia-markets-freshness.json \
            apps/asia-markets-dashboard/src/data/dashboard-status-hk-commercial-aerospace.json
          git add -u data/normalized/hk_commercial_aerospace/

          if git diff --staged --quiet; then
            echo "No HK commercial aerospace data changes to commit"
            exit 0
          fi

          git commit -m "chore(hk-aerospace): refresh sector data [$(date -u +%Y-%m-%d)]"

          # The daily dashboard refresh also rebuilds commercial-aerospace
          # artifacts, so overlapping runs conflict on regenerated JSON.
          # -X theirs prefers THIS run's freshly rebuilt artifacts on
          # conflicting hunks; non-conflicting upstream changes still merge.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
