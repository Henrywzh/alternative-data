name: HK Retail Stores Monthly

# Store counts for these 11 companies are slow-moving (mature, established
# retail/F&B/jewellery chains), so monthly is a comfortable cadence -- no
# value in polling more often, and it keeps load on these third-party
# endpoints low.

on:
  schedule:
    # 1st of the month, 07:30 UTC.
    - cron: "30 7 1 * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date override (YYYY-MM-DD); blank = today"
        required: false
        default: ""

concurrency:
  group: hk-retail-stores-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-store-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Install Playwright browser (POP MART Taiwan check)
        run: python -m playwright install --with-deps chromium

      - name: Run HK retail store-count scrapers
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            DATE_ARG=$(date -u +%Y-%m-%d)
          fi
          bash scripts/run-store-scrapers.sh data "$DATE_ARG"

      - name: Commit store-count snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ctf_stores \
            data/processed/chowsangsang_stores \
            data/processed/fairwood_stores \
            data/processed/sasa_stores \
            data/processed/lukfook_stores \
            data/processed/cafedecoral_stores \
            data/processed/giordano_stores \
            data/processed/bossini_stores \
            data/processed/laopugold_stores \
            data/processed/taihing_stores \
            data/processed/popmart_stores \
            || true

          if git diff --staged --quiet; then
            echo "No store-count changes to commit"
            exit 0
          fi

          git commit -m "chore: update HK retail store counts [$(date -u +%Y-%m-%d)]"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - name: Upload store-count datasets
        uses: actions/upload-artifact@v7
        with:
          name: hk-retail-stores-dataset
          path: |
            data/processed/ctf_stores/
            data/processed/chowsangsang_stores/
            data/processed/fairwood_stores/
            data/processed/sasa_stores/
            data/processed/lukfook_stores/
            data/processed/cafedecoral_stores/
            data/processed/giordano_stores/
            data/processed/bossini_stores/
            data/processed/laopugold_stores/
            data/processed/taihing_stores/
            data/processed/popmart_stores/
          if-no-files-found: warn
