name: HK Stablecoin & Crypto Sector Data Refresh Weekly

# HK Stablecoin & Crypto data sources: HKMA licensed stablecoin issuers register,
# SFC VATP exchange register, DefiLlama stablecoin market cap, HKEX ETF AUM API,
# Coinbase/Binance BTC spot tickers, Fear & Greed Index, and Polymarket catalysts.
# Weekly cadence (Mondays 02:30 UTC) keeps regulatory registers and ETF fund sizes fresh.

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: hk-stablecoin-crypto-weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-hk-stablecoin-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Build HK Stablecoin & Crypto artifact
        working-directory: apps/asia-markets-dashboard
        run: |
          python3 scripts/build_hk_stablecoin_crypto_artifact.py \
            --output .generated/hk-stablecoin-crypto-artifact.json \
            --status-output src/data/dashboard-status-hk-stablecoin-crypto.json

      - name: Localize Streamlit-facing artifact
        working-directory: apps/asia-markets-dashboard
        run: node scripts/package-dashboard.mjs --localize-only --sector hk-stablecoin-crypto

      - name: Write freshness report
        run: python scripts/audit_asia_markets_freshness.py --report-only

      - name: Commit refreshed crypto data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            apps/asia-markets-dashboard/.generated/hk-stablecoin-crypto-artifact.json \
            apps/asia-markets-dashboard/.generated/hk-stablecoin-crypto-artifact-zh.json \
            apps/asia-markets-dashboard/.generated/asia-markets-freshness.json \
            apps/asia-markets-dashboard/src/data/dashboard-status-hk-stablecoin-crypto.json

          if git diff --staged --quiet; then
            echo "No HK stablecoin & crypto data changes to commit"
            exit 0
          fi

          git commit -m "chore(hk-stablecoin-crypto): refresh sector data [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
