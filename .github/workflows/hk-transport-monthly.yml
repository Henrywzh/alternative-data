name: HK Transport Sector Data Refresh Monthly

# Unlike hk-real-estate / hk-local-consumer (refreshed daily by
# asia-markets-dashboard-refresh-daily.yml), most HK Transport sources are
# monthly-cadence bulletins: MTR patronage, Cathay/HKIA traffic figures,
# vehicle-registration tables, MTTD Table 2.3 and C&SD E705. The parking
# snapshot is included in the same scheduled run as a current mobility poll;
# repeated runs are what create its high-frequency history.
#
# The source scrapers run before the artifact builder because the builder reads
# committed processed parquet snapshots rather than fetching these endpoints
# during packaging. Each independent source is allowed to fail while the last
# good processed snapshot remains available.
#
# This workflow does NOT run scripts/build-static-hub.mjs or
# scripts/package-dashboard.mjs, same limitation documented in
# asia-markets-dashboard-refresh-daily.yml: the portable HTML/zh packaging
# step depends on a local plugin bundle not available in CI. The
# .generated/hk-transport-artifact(.json|-zh.json) data and status file
# ARE kept fresh monthly; the rendered HTML dashboard requires a manual
# `npm run build` afterwards.

on:
  schedule:
    # Airline bulletins usually arrive by the 20th, while MTR patronage can
    # publish later and on an irregular date. Retry within the publication
    # window so a post-20th MTR release is not missed until the next month.
    - cron: "15 6 5,20,25,28 * *"
  workflow_dispatch:

concurrency:
  group: hk-transport-monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-hk-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Refresh China-listed-airline monthly traffic data
        # Tolerate a failure here rather than aborting the whole job: the
        # artifact builder below still works off whatever parquet rows are
        # already committed, same "keep the last good data" philosophy as
        # the daily refresh workflow's --tolerate-errors flag.
        timeout-minutes: 20
        run: |
          START_DATE="$(python3 - <<'PY'
          from datetime import date, timedelta
          print((date.today() - timedelta(days=400)).isoformat())
          PY
          )"
          python3 scripts/scrape_cn_airline_traffic.py --start-year "$START_DATE" \
            || echo "::warning::airline scraper failed, continuing with existing parquet"

      - name: Refresh TD passenger and vehicle datasets
        run: |
          python3 scripts/scrape_hk_passenger_journeys.py || echo "::warning::TD Table 2.1 scraper failed"
          python3 scripts/scrape_hk_mttd_passenger_journeys.py || echo "::warning::TD MTTD Table 2.3 scraper failed"
          python3 scripts/scrape_hk_vehicle_stock.py || echo "::warning::TD Table 4.1(a) scraper failed"
          python3 scripts/scrape_hk_private_car_net_growth.py || echo "::warning::TD Table 4.1(c) scraper failed"
          python3 scripts/scrape_hk_private_car_first_reg.py || echo "::warning::TD Table 4.1(e) scraper failed"
          python3 scripts/scrape_hk_first_registered_vehicle_details.py || echo "::warning::TD vehicle make/model detail scraper failed"

      - name: Refresh TD parking and C&SD mobility datasets
        run: |
          python3 scripts/scrape_hk_parking_vacancy.py || echo "::warning::TD parking-vacancy scraper failed"
          python3 scripts/scrape_hk_carpark_occupancy.py || echo "::warning::TD car-park occupancy scraper failed"
          python3 scripts/scrape_hk_boundary_movements.py || echo "::warning::C&SD E705 scraper failed"

      - name: Build HK Transport artifact
        working-directory: apps/asia-markets-dashboard
        run: |
          python3 scripts/build_hk_transport_artifact.py \
            --output .generated/hk-transport-artifact.json \
            --status-output src/data/dashboard-status-hk-transport.json

      - name: Localize Streamlit-facing artifacts
        working-directory: apps/asia-markets-dashboard
        run: node scripts/package-dashboard.mjs --localize-only --sector hk-transport

      - name: Write freshness report
        run: python scripts/audit_asia_markets_freshness.py --report-only

      - name: Commit refreshed transport data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/airline_traffic/china_airlines_monthly.parquet \
            data/processed/airline_traffic/china_airlines_operating_events.parquet \
            data/normalized/hk_transport/airline_operating_release_registry.csv \
            data/processed/transport/ \
            apps/asia-markets-dashboard/.generated/hk-transport-artifact.json \
            apps/asia-markets-dashboard/.generated/hk-transport-artifact-zh.json \
            apps/asia-markets-dashboard/.generated/asia-markets-freshness.json \
            apps/asia-markets-dashboard/src/data/dashboard-status-hk-transport.json

          if git diff --staged --quiet; then
            echo "No HK transport data changes to commit"
            exit 0
          fi

          git commit -m "chore(hk-transport): refresh sector data [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Enforce transport observation freshness
        if: always()
        run: |
          python scripts/audit_asia_markets_freshness.py \
            --sector hk-transport \
            --output /tmp/hk-transport-freshness.json
