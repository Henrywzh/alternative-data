name: Index & ETF Allocation Monitor Daily

on:
  schedule:
    # MTG Asia close ~07:00 UTC; run after HK/CN closes (17:15 Beijing), before
    # the Asia Markets dashboard refresh daily job completes its own build.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-monitor-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Fetch indices/ETFs and send daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Validate Gmail configuration
        id: gmail_config
        run: |
          if test -n "$GMAIL_SENDER" && test -n "$GMAIL_APP_PASSWORD" && test -n "$GMAIL_RECIPIENTS"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gmail not fully configured; email will be skipped but dashboard still updates."
          fi

      - name: Run offline unit tests
        run: |
          python -m pytest tests/market_monitor -q

      - name: Fetch and derive index/ETF signals
        run: |
          python -m market_monitor.cli

      - name: Build dashboard artifact
        working-directory: apps/asia-markets-dashboard
        run: |
          python scripts/build_market_monitor_artifact.py \
            --output .generated/market-monitor-artifact.json \
            --status-output src/data/dashboard-status-market-monitor.json

      - name: Send daily email digest
        if: steps.gmail_config.outputs.configured == 'true'
        continue-on-error: true
        run: |
          python -c "
          from market_monitor.alerts import build_email_html, send_report
          from market_monitor.storage import load_latest_derived
          from datetime import date
          tech = load_latest_derived('exposure_technicals')
          regime = load_latest_derived('relative_regime')
          wrap = load_latest_derived('wrapper_metrics')
          body = build_email_html(report_date=date.today().isoformat(), technicals=tech, regime=regime, wrappers=wrap)
          send_report(subject=f'Index & ETF Allocation Monitor — {date.today().isoformat()}', body_html=body)
          "

      - name: Commit refreshed data + artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/market_monitor data/derived/market_monitor \
            apps/asia-markets-dashboard/.generated/market-monitor-artifact.json \
            apps/asia-markets-dashboard/.generated/market-monitor-artifact-zh.json \
            apps/asia-markets-dashboard/src/data/dashboard-status-market-monitor.json
          if git diff --staged --quiet; then
            echo "No market-monitor changes to commit"
            exit 0
          fi
          git commit -m "chore(market-monitor): refresh index/ETF signals [$(date -u +%Y-%m-%d)]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
