name: Index & ETF Allocation Monitor Daily

on:
  schedule:
    # MTG Asia close ~07:00 UTC; run after HK/CN closes (17:15 Beijing), before
    # the Asia Markets dashboard refresh daily job completes its own build.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-monitor-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Fetch indices/ETFs and send daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install a CJK font for the email charts
        run: |
          # Every chart title in the digest carries Chinese ("CSI 300 (沪深300)")
          # and matplotlib's default DejaVu Sans has none of those glyphs. The
          # runner ships no CJK font, so the charts arrived with boxes where the
          # characters should be -- rendering fine, saying nothing, for as long
          # as this job has been sending mail.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Validate Gmail configuration
        id: gmail_config
        run: |
          if test -n "$GMAIL_SENDER" && test -n "$GMAIL_APP_PASSWORD" && test -n "$GMAIL_RECIPIENTS"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gmail not fully configured; email will be skipped but dashboard still updates."
          fi

      - name: Run offline unit tests
        run: |
          python -m pytest tests/market_monitor -q

      - name: Fetch and derive index/ETF signals
        id: pipeline
        run: |
          # Required stale/unavailable/invalid regional or source data, a
          # coverage regression or a failed fetch blocks the email, but not
          # the artifact build: the dashboard publishes technical data and
          # its explicit freshness warning.
          python -m market_monitor.cli \
            --mode close \
            --send-report \
            --require-fresh \
            --allow-stale-artifact

      - name: Build dashboard artifact
        working-directory: apps/asia-markets-dashboard
        run: |
          python scripts/build_market_monitor_artifact.py \
            --output .generated/market-monitor-artifact.json

      - name: Commit refreshed data + artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/market_monitor data/derived/market_monitor \
            apps/asia-markets-dashboard/.generated/market-monitor-artifact.json \
            apps/asia-markets-dashboard/.generated/market-monitor-artifact-zh.json
          if git diff --staged --quiet; then
            echo "No market-monitor changes to commit"
            exit 0
          fi
          git commit -m "chore(market-monitor): refresh index/ETF signals [$(date -u +%Y-%m-%d)]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Fail the run when the digest was skipped
        if: steps.pipeline.outputs.degraded == 'true'
        run: |
          # The artifact and the commit above are deliberately allowed through
          # on a degraded run. Without this step the operator's only signal
          # that no digest was sent is the absence of an email, which is
          # indistinguishable from a quiet day -- so end the job red.
          echo "::error::Freshness gate skipped the digest; see the job summary."
          exit 1
