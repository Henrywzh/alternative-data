name: Index & ETF Allocation Monitor Intraday Snapshot

on:
  schedule:
    # Approx. 12:15 Asia/Taipei (UTC+8), after the A-share/HK morning session.
    # This workflow is deliberately separate from the close pipeline: it
    # fetches only the live ETF quote snapshot and never writes daily history.
    - cron: "15 4 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  # The only persisted output is the tiny alert delivery cursor. Intraday
  # prices/quotes remain non-persistent and are never committed.
  contents: write

jobs:
  intraday:
    name: Fetch live ETF snapshot and evaluate event alert
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install a CJK font for the email charts
        run: |
          # Same reason as the close job: the chart titles are Chinese and the
          # runner ships no font that can draw them.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Require Gmail configuration
        run: |
          # Unlike the close job, the alert is this workflow's only market
          # output. The delivery cursor is persisted separately below; no
          # quote history or dashboard artifact is written here.
          if test -z "$GMAIL_SENDER" || test -z "$GMAIL_APP_PASSWORD" || test -z "$GMAIL_RECIPIENTS"; then
            echo "::error::Gmail is not fully configured; the midday digest has no other output."
            exit 1
          fi

      - name: Fetch live snapshot and evaluate alert
        run: |
          python -m market_monitor.cli \
            --mode intraday \
            --send-report \
            --require-fresh

      - name: Commit alert delivery cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f data/derived/market_monitor/alert_state.json; then
            git add data/derived/market_monitor/alert_state.json
          fi
          if git diff --staged --quiet; then
            echo "No alert-state changes to commit"
            exit 0
          fi
          git commit -m "chore(market-monitor): persist alert delivery state [$(date -u +%Y-%m-%d)]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
