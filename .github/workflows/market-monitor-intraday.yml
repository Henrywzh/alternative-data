name: Index & ETF Allocation Monitor Intraday Snapshot

on:
  schedule:
    # Approx. 12:15 Asia/Taipei (UTC+8), after the A-share/HK morning session.
    # This workflow is deliberately separate from the close pipeline: it
    # fetches only the live ETF quote snapshot and never writes daily history.
    - cron: "15 4 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-monitor-intraday
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intraday:
    name: Fetch live ETF snapshot and send midday digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install a CJK font for the email charts
        run: |
          # Same reason as the close job: the chart titles are Chinese and the
          # runner ships no font that can draw them.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Require Gmail configuration
        run: |
          # Unlike the close job, the digest is this workflow's only output --
          # it writes no data and builds no artifact. Missing credentials would
          # otherwise surface as a green run that produced nothing at all,
          # because the CLI treats a send failure as best-effort.
          if test -z "$GMAIL_SENDER" || test -z "$GMAIL_APP_PASSWORD" || test -z "$GMAIL_RECIPIENTS"; then
            echo "::error::Gmail is not fully configured; the midday digest has no other output."
            exit 1
          fi

      - name: Fetch live snapshot and send digest
        run: |
          python -m market_monitor.cli \
            --mode intraday \
            --send-report \
            --require-fresh
