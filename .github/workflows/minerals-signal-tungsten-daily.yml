name: Minerals Daily Price Report

on:
  schedule:
    # Run Monday through Friday at 09:15 UTC (17:15 Beijing/Hong Kong Time),
    # after the China and Hong Kong closes, CTIA publication, and quote lag.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: minerals-signal-tungsten-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-tungsten-molybdenum:
    name: Refresh prices and send daily mineral reports
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINERALS_REPORT_ENV: production
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Validate Gmail configuration
        run: |
          test -n "$GMAIL_SENDER" || { echo "Missing GMAIL_SENDER repository secret"; exit 1; }
          test -n "$GMAIL_APP_PASSWORD" || { echo "Missing GMAIL_APP_PASSWORD repository secret"; exit 1; }
          test -n "$GMAIL_RECIPIENTS" || { echo "Missing GMAIL_RECIPIENTS repository secret"; exit 1; }

      - name: Run scraper tests
        run: |
          pytest tests/test_minerals_tungsten_scraper.py tests/test_ctia_scraper.py tests/test_minerals_market_data.py tests/test_minerals_daily_report.py -q

      - name: Run bounded CTIA daily scraper
        id: ctia_scrape
        continue-on-error: true
        run: |
          # One API page per category; API and optional price-image requests
          # are spaced at least 15 seconds apart. A transient network failure
          # is reported below and freshness validation decides whether the
          # existing data is still recent enough to send.
          minerals-signal-data scrape-tungsten --base-dir . --source ctia --max-pages 1 --since-days 31 --with-tungsten-ocr

      - name: Warn on CTIA scrape failure
        if: steps.ctia_scrape.outcome == 'failure'
        run: |
          echo "::warning::CTIA scrape failed (likely a transient network issue); continuing with existing data. See the 'Run bounded CTIA daily scraper' step for details."

      - name: Validate recent tungsten coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          path = Path("data/raw/minerals_signal_data/tungsten_chinatungsten.csv")
          if not path.exists():
              raise SystemExit("Missing tungsten raw CSV after scrape")

          fields = [
              "wolframite_concentrate",
              "scheelite_concentrate",
              "apt",
              "tungsten_powder",
              "tungsten_carbide_powder",
              "ferrotungsten",
          ]
          frame = pd.read_csv(path)
          frame["date"] = pd.to_datetime(frame["date"], errors="coerce")
          cutoff = (
              pd.Timestamp.now(tz="Asia/Shanghai").normalize().tz_localize(None)
              - pd.Timedelta(days=14)
          )
          recent = frame[frame["date"] >= cutoff].copy()
          counts = recent[fields].apply(pd.to_numeric, errors="coerce").notna().sum()
          print(f"Tungsten rows with prices in last 14 days: {len(recent)}")
          print(counts.to_string())
          if int(counts.sum()) == 0:
              raise SystemExit("No validated tungsten price fields in the last 14 days")
          PY

      - name: Validate recent molybdenum coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          path = Path("data/raw/minerals_signal_data/molybdenum_chinatungsten.csv")
          if not path.exists():
              raise SystemExit("Missing molybdenum raw CSV after scrape")

          fields = [
              "molybdenum_concentrate",
              "ferromolybdenum",
              "ammonium_heptamolybdate",
              "ammonium_tetramolybdate",
          ]
          frame = pd.read_csv(path)
          frame["date"] = pd.to_datetime(frame["date"], errors="coerce")
          cutoff = pd.Timestamp.now(tz="UTC").tz_convert(None).normalize() - pd.Timedelta(days=45)
          recent = frame[frame["date"] >= cutoff].copy()
          if recent.empty:
              raise SystemExit("No recent molybdenum rows found in the last 45 days")

          counts = recent[fields].replace("", pd.NA).notna().sum()
          print(counts.to_string())
          if int(counts.sum()) == 0:
              raise SystemExit("Recent molybdenum rows exist, but all tracked price fields are empty")
          PY

      - name: Report rare earth coverage (informational only)
        run: |
          python - <<'PY'
          # Thin/unproven category: log coverage but never fail the job on it.
          # See chinatungsten_scraper.py module docstring for context.
          from pathlib import Path

          import pandas as pd

          path = Path("data/raw/minerals_signal_data/rare_earth_chinatungsten.csv")
          if not path.exists():
              print("No rare earth raw CSV yet.")
              raise SystemExit(0)

          fields = [
              "lanthanum_oxide", "cerium_oxide", "praseodymium_oxide", "neodymium_oxide",
              "samarium_oxide", "europium_oxide", "gadolinium_oxide", "terbium_oxide",
              "dysprosium_oxide", "holmium_oxide", "erbium_oxide", "yttrium_oxide",
          ]
          frame = pd.read_csv(path)
          frame["date"] = pd.to_datetime(frame["date"], errors="coerce")
          cutoff = pd.Timestamp.now(tz="UTC").tz_convert(None).normalize() - pd.Timedelta(days=45)
          recent = frame[frame["date"] >= cutoff].copy()
          print(f"Rare earth rows in last 45 days: {len(recent)}")
          if not recent.empty:
              print(recent[fields].replace("", pd.NA).notna().sum().to_string())
          PY

      - name: Send daily Tungsten and Molybdenum reports
        run: |
          minerals-signal-data send-daily-report --base-dir .

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'data/raw/minerals_signal_data/*.csv' \
                  'data/processed/minerals_signal_data/tungsten_price_daily/latest/**' \
                  'data/processed/minerals_signal_data/molybdenum_price_daily/latest/**' \
                  'data/processed/minerals_signal_data/rare_earth_price_daily/latest/**'
          if git diff --staged --quiet; then
            echo "No changes in daily mineral prices to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: update daily tungsten, molybdenum, and rare earth price data"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
