name: Minerals Signal Tungsten Daily

on:
  schedule:
    # Run Monday through Friday at 12:00 UTC (20:00 Beijing Time)
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: minerals-signal-tungsten-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-tungsten:
    name: Scrape Daily Tungsten Price
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Chinatungsten daily scraper
        run: |
          minerals-signal-data scrape-tungsten --base-dir .

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'data/raw/minerals_signal_data/*.csv' \
                  'data/processed/minerals_signal_data/tungsten_price_daily/latest/**' \
                  'data/processed/minerals_signal_data/molybdenum_price_daily/latest/**'
          if git diff --staged --quiet; then
            echo "No changes in daily mineral prices to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: update daily tungsten and molybdenum price data"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
