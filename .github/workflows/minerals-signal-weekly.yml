name: Minerals Dashboard Weekly

on:
  schedule:
    # Saturday 08:00 UTC — after the Friday (W-FRI) weekly close the signals resample on.
    - cron: "0 8 * * 6"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Price history start date (YYYY-MM-DD)"
        required: false
        default: "2022-01-01"
      end_date:
        description: "Optional price history end date (YYYY-MM-DD)"
        required: false
        default: ""

concurrency:
  group: minerals-signal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-live:
    name: Refresh live minerals dashboard datasets
    runs-on: ubuntu-latest
    env:
      # FRED powers the lead/zinc/tin price series; reuse the existing repo secret.
      FRED_API_KEY: ${{ secrets.SEMICONDUCTOR_FRED_API_KEY }}
      # Optional: enables tradingeconomics_api price sources when configured.
      TRADING_ECONOMICS_API_KEY: ${{ secrets.MINERALS_TRADING_ECONOMICS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run live minerals pipeline
        run: |
          START_DATE="${{ github.event.inputs.start_date }}"
          if [ -z "$START_DATE" ]; then START_DATE="2022-01-01"; fi
          END_ARG=""
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            END_ARG="--end-date ${{ github.event.inputs.end_date }}"
          fi
          minerals-signal-data run-live \
            --base-dir . \
            --workbook data/reference/minerals_signal_data/critical_minerals.csv \
            --stock-mapping data/reference/minerals_signal_data/stock_mapping.csv \
            --run-label latest \
            --start-date "$START_DATE" \
            $END_ARG

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'data/processed/minerals_signal_data/**/latest/**'
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: update live minerals dashboard datasets"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: minerals-signal-latest
          path: data/processed/minerals_signal_data/**/latest/
          if-no-files-found: warn
