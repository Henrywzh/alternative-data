name: OFR Macro Data Daily Update

on:
  schedule:
    - cron: "45 3 * * *"        # 03:45 UTC daily
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write

jobs:
  scrape-ofr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run daily update
        run: |
          python -m ofr_macro_data.cli --data-dir .

      - name: Commit normalized datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/normalized/ofr_macro/*.parquet

          if git diff --cached --quiet; then
            echo "No OFR data changes to commit"
            exit 0
          fi

          git commit -m "chore: update OFR macro datasets [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Upload normalized datasets
        uses: actions/upload-artifact@v4
        with:
          name: ofr-macro-data
          path: data/normalized/ofr_macro/
          if-no-files-found: warn
