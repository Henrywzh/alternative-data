name: OpenCode Data Daily

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: opencode-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Collect OpenCode datasets
        run: |
          python -m opencode_data.cli --base-dir . scrape --top-models 20

      - name: Commit normalized OpenCode datasets
        run: |
          if git diff --quiet -- data/normalized/opencode; then
            echo "No OpenCode dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/opencode
          git commit -m "chore: update OpenCode datasets [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Package raw response snapshots
        if: always()
        run: |
          if [ -d data/raw/opencode ]; then
            tar -czf "$RUNNER_TEMP/opencode-raw.tar.gz" -C data/raw/opencode .
          fi

      - name: Upload raw snapshots artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: opencode-raw-snapshots
          path: ${{ runner.temp }}/opencode-raw.tar.gz
          if-no-files-found: warn
          retention-days: 7
