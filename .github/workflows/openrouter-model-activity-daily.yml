name: OpenRouter Model Activity Daily

on:
  schedule:
    - cron: "30 2 * * *" # After provider activity; captures per-model requests and workload categories.
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum models to scrape; blank uses the Streamlit-safe default"
        required: false
        default: "250"

concurrency:
  group: openrouter-model-activity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-model-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run daily model activity update
        env:
          MODEL_LIMIT: ${{ github.event.inputs.limit || '250' }}
        run: python -m openrouter_data.cli --base-dir . activity-daily-update --limit "$MODEL_LIMIT"

      - name: Commit compact normalized dataset
        run: |
          if git diff --quiet -- \
            data/normalized/openrouter/openrouter_model_activity.parquet \
            data/normalized/openrouter_archive; then
            echo "No model activity changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/openrouter/openrouter_model_activity.parquet
          if [ -d data/normalized/openrouter_archive ]; then
            git add data/normalized/openrouter_archive
          fi
          git commit -m "chore: update OpenRouter model activity [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; retrying after a fresh rebase"
            sleep $((attempt * 5))
          done

          echo "Failed to push model activity dataset after 3 attempts"
          exit 1

      - name: Package raw snapshots for debugging
        if: always()
        run: |
          if [ -d data/raw/openrouter ]; then
            tar -czf "$RUNNER_TEMP/openrouter-model-activity-raw.tar.gz" -C data/raw/openrouter .
          fi

      - name: Upload short-lived raw snapshots for debugging
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-model-activity-raw
          path: ${{ runner.temp }}/openrouter-model-activity-raw.tar.gz
          if-no-files-found: warn
          retention-days: 7
