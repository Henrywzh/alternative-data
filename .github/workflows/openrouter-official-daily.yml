name: OpenRouter Official Data Daily

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Collection mode"
        required: true
        default: "daily-update"
        type: choice
        options:
          - daily-update
          - rankings-backfill

concurrency:
  group: openrouter-official-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Collect documented OpenRouter datasets
        env:
          COMMAND: ${{ github.event.inputs.command || 'daily-update' }}
        run: |
          if [ "$COMMAND" = "rankings-backfill" ]; then
            python -m openrouter_official_data.cli --base-dir . rankings-backfill --start-date 2025-01-01
          else
            python -m openrouter_official_data.cli --base-dir . daily-update
          fi

      - name: Run official-source quality tests
        run: python -m pytest -q tests/test_openrouter_official_data.py tests/test_market_pulse_data.py

      - name: Commit compact normalized datasets
        run: |
          if git diff --quiet -- data/normalized/openrouter_official data/normalized/overview; then
            echo "No official OpenRouter dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/openrouter_official data/normalized/overview
          git commit -m "chore: update official OpenRouter datasets [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Package raw responses for short-lived debugging
        if: always()
        run: |
          if [ -d data/raw/openrouter_official ]; then
            tar -czf "$RUNNER_TEMP/openrouter-official-raw.tar.gz" -C data/raw/openrouter_official .
          fi

      - name: Upload raw responses
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-official-raw
          path: ${{ runner.temp }}/openrouter-official-raw.tar.gz
          if-no-files-found: warn
          retention-days: 7
