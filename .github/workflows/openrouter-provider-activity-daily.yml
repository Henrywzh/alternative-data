name: OpenRouter Provider Activity Daily

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC — after rankings weekly runs
  workflow_dispatch:        # allow manual trigger for backfill

concurrency:
  group: openrouter-provider-activity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  scrape-provider-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Test provider pipelines
        run: |
          python -m pytest -q \
            tests/test_openrouter_activity_pipeline.py \
            tests/test_openrouter_serving_provider.py \
            tests/test_research_data.py \
            tests/test_dashboard_data.py \
            tests/test_dashboard_smoke.py

      # Offline unit tests cannot see an upstream page changing shape. Keep
      # the live extraction canary that used to be this workflow's only
      # validation step, rather than replacing it with the tests.
      - name: Validate provider activity extraction
        run: |
          python -m openrouter_data.cli --base-dir . provider-activity-validate

      - name: Run provider activity daily update
        run: |
          python -m openrouter_data.cli --base-dir . provider-activity-daily-update

      # The serving-provider sweep touches ~100 third-party pages. A bad day
      # there must not discard the provider-activity data the previous step
      # already fetched -- these steps sit ahead of the shared commit step.
      - name: Run serving-provider activity daily update
        id: serving_activity
        continue-on-error: true
        run: |
          python -m openrouter_data.cli --base-dir . serving-provider-activity-daily-update

      - name: Rebuild daily provider economics
        env:
          # The provider update has just written fresh local parquet files.
          # Prevent the dashboard loader from replacing them with the previous
          # committed snapshot while building the marts.
          DATA_SOURCE: local
        run: |
          python -m research_data.cli --base-dir . build-mart daily_provider_economics --refresh

      - name: Rebuild daily provider revenue estimates
        env:
          DATA_SOURCE: local
        run: |
          python -m research_data.cli --base-dir . build-mart daily_provider_revenue_estimates --refresh

      - name: Rebuild serving-provider economics
        id: serving_economics
        continue-on-error: true
        env:
          DATA_SOURCE: local
        run: |
          python -m research_data.cli --base-dir . build-mart daily_cloud_infra_economics --refresh

      - name: Refresh overview signals from provider activity
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          from market_pulse_data import build_overview_signal_series

          now = datetime.now(timezone.utc)
          scraped_at = now.isoformat().replace("+00:00", "Z")
          run_id = now.strftime("%Y%m%dT%H%M%SZ") + "-provider-activity"
          build_overview_signal_series(Path("."), run_id=run_id, scraped_at=scraped_at)
          PY

      - name: Commit normalized datasets
        run: |
          if git diff --quiet -- \
            data/normalized/openrouter/provider_daily_activity.parquet \
            data/normalized/openrouter/cloud_infra_daily_activity.parquet \
            data/normalized/marts/daily_provider_economics.parquet \
            data/normalized/marts/daily_provider_revenue_estimates.parquet \
            data/normalized/marts/daily_cloud_infra_economics.parquet \
            data/normalized/overview/overview_signal_series.parquet; then
            echo "No provider activity or economics changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/openrouter/provider_daily_activity.parquet
          git add data/normalized/openrouter/cloud_infra_daily_activity.parquet
          git add data/normalized/marts/daily_provider_economics.parquet
          git add data/normalized/marts/daily_provider_revenue_estimates.parquet
          git add data/normalized/marts/daily_cloud_infra_economics.parquet
          git add data/normalized/overview/overview_signal_series.parquet
          git commit -m "chore: update provider activity and economics data [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after a fresh rebase"
            sleep $((attempt * 5))
          done
          exit 1

      # The serving-provider steps above are continue-on-error so one bad day
      # against ~100 third-party pages cannot discard the data earlier steps
      # already fetched. That protection also hides a persistent breakage: the
      # job stays green while every reader of the dataset silently degrades.
      # Check the artifact rather than the step outcome, and do it after the
      # commit so a violation reports loudly without blocking the datasets that
      # did refresh correctly.
      #
      # Shape was not enough. The mart rebuild below crashed on every run from
      # 2026-08-21 to 2026-08-30 -- a hard TypeError, which continue-on-error
      # turns into a step GitHub reports as *success* -- and nothing noticed,
      # because the stale file still had its columns, its key and its rows. Both
      # artifacts of a continue-on-error producer now have to be current too. A
      # two-day allowance tolerates one missed or bad day; a producer that has
      # stopped producing cannot hide behind it.
      - name: Verify serving-provider dataset contract
        run: |
          python scripts/check_dataset_contract.py \
            cloud_infra_daily_activity \
            data/normalized/openrouter/cloud_infra_daily_activity.parquet \
            --fresh-within-days 2

      - name: Verify serving-provider economics mart contract
        run: |
          python scripts/check_dataset_contract.py \
            daily_cloud_infra_economics \
            data/normalized/marts/daily_cloud_infra_economics.parquet \
            --fresh-within-days 2

      - name: Upload normalized datasets
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: provider-daily-activity
          path: |
            data/normalized/openrouter/provider_daily_activity.parquet
            data/normalized/openrouter/cloud_infra_daily_activity.parquet
            data/normalized/marts/daily_provider_economics.parquet
            data/normalized/marts/daily_provider_revenue_estimates.parquet
            data/normalized/marts/daily_cloud_infra_economics.parquet
            data/normalized/overview/overview_signal_series.parquet
          if-no-files-found: warn

      - name: Fetch previous Phase 0 baseline
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ops/fetch_baseline.py \
            --artifact-prefix ops-shadow-openrouter-provider-activity- \
            --output /tmp/ops-baseline-openrouter-provider-activity.json

      - name: Emit Phase 0 shadow run report
        if: always()
        continue-on-error: true
        env:
          OPS_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/ops/finalize_pipeline.py \
            --pipeline-id openrouter-provider-activity \
            --job-id scrape-provider-activity \
            --execution "$OPS_JOB_STATUS" \
            --producer-outcome "serving-activity=${{ steps.serving_activity.outcome }}" \
            --producer-outcome "serving-economics=${{ steps.serving_economics.outcome }}" \
            --baseline-report /tmp/ops-baseline-openrouter-provider-activity.json \
            --output artifacts/ops/openrouter-provider-activity/run-report.json \
            --evidence-output artifacts/ops/openrouter-provider-activity/evidence-manifest.json

      - name: Ensure Phase 0 fallback telemetry exists
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OPS_PIPELINE_ID: openrouter-provider-activity
          OPS_JOB_ID: scrape-provider-activity
          OPS_JOB_STATUS: ${{ job.status }}
          OPS_REPORT_PATH: artifacts/ops/openrouter-provider-activity/run-report.json
          OPS_EVIDENCE_PATH: artifacts/ops/openrouter-provider-activity/evidence-manifest.json
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const reportPath = process.env.OPS_REPORT_PATH;
            const observedAt = new Date().toISOString();
            const runId = process.env.GITHUB_RUN_ID || `fallback-${observedAt}`;
            const runUrl = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY
              ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}` : null;
            const allowed = new Set(["success", "failure", "cancelled"]);
            const execution = allowed.has(process.env.OPS_JOB_STATUS) ? process.env.OPS_JOB_STATUS : "unknown";
            const message = "Repository finalizer was unavailable; emitted runner-level fallback telemetry.";
            const required = ["pipeline_id", "job_id", "run_id", "finished_at", "execution",
              "collection", "data_health", "publication", "evidence_quality", "derived_state",
              "checks", "outputs", "evidence"];
            let report = null;
            try {
              const candidate = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              if (candidate.schema_version !== 1 || candidate.shadow !== true
                  || required.some((key) => !(key in candidate))
                  || !Array.isArray(candidate.checks) || !Array.isArray(candidate.outputs)
                  || !Array.isArray(candidate.evidence)) throw new Error("invalid run report");
              report = candidate;
            } catch {}
            if (!report) {
              const evidence = [{kind: "finalizer-error", path: null, observed_at: observedAt,
                description: message, run_url: runUrl, commit_sha: process.env.GITHUB_SHA || "unknown",
                check_id: "ops-shadow-finalizer", references: runUrl ? [runUrl] : []}];
              report = {
                schema_version: 1, pipeline_id: process.env.OPS_PIPELINE_ID,
                job_id: process.env.OPS_JOB_ID, workflow: process.env.GITHUB_WORKFLOW || "unknown",
                run_id: runId, run_attempt: Math.max(Number(process.env.GITHUB_RUN_ATTEMPT) || 1, 1),
                commit_sha: process.env.GITHUB_SHA || "unknown", started_at: null,
                finished_at: observedAt, execution, collection: "unknown", data_health: "unknown",
                publication: "failed", evidence_quality: "incomplete",
                derived_state: "UNKNOWN_EVIDENCE",
                checks: [{check_id: "ops-shadow-finalizer", status: "unknown", required: true,
                  message, expected: null, observed: null, details: {}}],
                outputs: [], evidence, shadow: true
              };
              fs.mkdirSync(path.dirname(reportPath), {recursive: true});
              fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + "\n");
            }
            const manifest = {version: 1, pipeline_id: report.pipeline_id, job_id: report.job_id,
              run_id: report.run_id, run_url: runUrl, commit_sha: report.commit_sha,
              observed_at: report.finished_at, evidence: report.evidence};
            let manifestValid = false;
            try {
              const existing = JSON.parse(fs.readFileSync(process.env.OPS_EVIDENCE_PATH, "utf8"));
              manifestValid = existing.version === 1 && existing.pipeline_id === report.pipeline_id
                && existing.job_id === report.job_id && existing.run_id === report.run_id
                && Array.isArray(existing.evidence);
            } catch {}
            if (!manifestValid) {
              fs.mkdirSync(path.dirname(process.env.OPS_EVIDENCE_PATH), {recursive: true});
              fs.writeFileSync(process.env.OPS_EVIDENCE_PATH, JSON.stringify(manifest, null, 2) + "\n");
            }

      - name: Upload Phase 0 shadow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ops-shadow-openrouter-provider-activity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ops/openrouter-provider-activity/
          if-no-files-found: warn
          retention-days: 30
