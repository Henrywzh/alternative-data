name: OpenRouter Rankings Weekly

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: openrouter-rankings-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m playwright install --with-deps chromium

      - name: Validate extractor against live source
        run: |
          python -m openrouter_data.cli --base-dir . validate

      - name: Run weekly update
        run: |
          python -m openrouter_data.cli --base-dir . weekly-update

      - name: Commit normalized datasets
        run: |
          if git diff --quiet -- data/normalized/openrouter; then
            echo "No normalized dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/openrouter
          git commit -m "chore: update normalized OpenRouter datasets"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after a fresh rebase"
            sleep $((attempt * 5))
          done
          echo "Failed to push OpenRouter rankings datasets after 3 attempts"
          exit 1

      - name: Upload raw snapshots
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-raw-snapshots
          path: data/raw/openrouter/
          if-no-files-found: error

      - name: Upload normalized datasets
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-normalized-datasets
          path: data/normalized/openrouter/
          if-no-files-found: error
