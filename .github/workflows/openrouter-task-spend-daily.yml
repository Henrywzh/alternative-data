name: OpenRouter Task Spend Daily

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-task-spend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Validate extractor against live source
        run: |
          python -m openrouter_data.cli --base-dir . task-spend-validate

      - name: Run daily update
        run: |
          python -m openrouter_data.cli --base-dir . task-spend-daily-update

      - name: Commit normalized dataset
        run: |
          if [ -z "$(git status --porcelain -- data/normalized/openrouter/openrouter_task_spend.parquet)" ]; then
            echo "No task-spend dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/openrouter/openrouter_task_spend.parquet
          git commit -m "chore: update OpenRouter task spend dataset"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - name: Upload raw snapshots
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-task-spend-raw-snapshots
          path: data/raw/openrouter/
          if-no-files-found: error

      - name: Upload normalized dataset
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-task-spend-normalized-dataset
          path: |
            data/normalized/openrouter/openrouter_task_spend.parquet
          if-no-files-found: error
