name: OpenRouter Task Spend Daily

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: openrouter-task-spend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-task-spend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Validate extractor against live source
        run: |
          python -m openrouter_data.cli --base-dir . task-spend-validate

      - name: Run daily update
        run: |
          python -m openrouter_data.cli --base-dir . task-spend-daily-update

      - name: Commit normalized dataset
        run: |
          # openrouter_task_spend is stored as one parquet per snapshot_date.
          # The storage layer migrates on write, so the first run after the
          # layout change deletes the single file and creates the directory --
          # both spellings have to be handled. A path is included when it
          # exists OR is still tracked: a tracked-but-deleted file must be
          # staged, or its deletion stays in the working tree and the later
          # `git pull --rebase` aborts with "You have unstaged changes".
          PATHS=""
          for candidate in \
            data/normalized/openrouter/openrouter_task_spend \
            data/normalized/openrouter/openrouter_task_spend.parquet \
            data/normalized/openrouter/openrouter_task_spend.csv; do
            if [ -e "$candidate" ] || git ls-files --error-unmatch "$candidate" >/dev/null 2>&1; then
              PATHS="$PATHS $candidate"
            fi
          done

          # shellcheck disable=SC2086
          if [ -z "$PATHS" ] || [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "No task-spend dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -A -- $PATHS
          git commit -m "chore: update OpenRouter task spend dataset"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after a fresh rebase"
            sleep $((attempt * 5))
          done
          echo "Failed to push OpenRouter task-spend dataset after 3 attempts"
          exit 1

      - name: Upload raw snapshots
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-task-spend-raw-snapshots
          path: data/raw/openrouter/
          if-no-files-found: error

      - name: Upload normalized dataset
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-task-spend-normalized-dataset
          path: |
            data/normalized/openrouter/openrouter_task_spend/
            data/normalized/openrouter/openrouter_task_spend.parquet
          if-no-files-found: error
