# Filename kept as ramp-monthly.yml so the existing run history stays attached
# to this workflow; the cadence below is weekly.
name: Ramp Vendor Intelligence Weekly Update

on:
  schedule:
    # Ramp's data is monthly, but its publication day is not fixed and the
    # feeds do not land together -- in Aug 2026 the category charts carried
    # July while the AI Index still stopped at June. A single monthly run
    # therefore misses whichever feed publishes after it, and the miss costs a
    # full month. Poll weekly instead: a run with nothing new is a no-op commit
    # step, so the only cost of over-polling is a few minutes of CI.
    - cron: "0 5 * * 1"          # 05:00 UTC every Monday
  workflow_dispatch:            # allow manual trigger / backfill

permissions:
  contents: write

jobs:
  scrape-ramp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run vendor update
        # The quality gate runs inside `update` (before any write), so a blocked
        # or malformed crawl aborts here and never overwrites committed history.
        run: |
          python -m ramp_data.cli --base-dir . update

      - name: Run AI Index update
        # Server-rendered AI Index datasets (adoption, spend, model share). Gated
        # before write like the vendor crawl.
        run: |
          python -m ramp_data.cli --base-dir . ai-index

      - name: Run Filter-mode update
        # AI Index "Filter mode" cohort timeseries (spend/model/pepm by every filter
        # combination), fetched from the versioned filter-mode API endpoints.
        run: |
          python -m ramp_data.cli --base-dir . filter-mode

      - name: Run Category-charts update
        # Category-level adoption charts, dynamically scraped from Datawrapper
        # widgets.
        #
        # This step used to carry continue-on-error, so that a gate failure
        # here could not block the already-successful vendor/ai-index/
        # filter-mode datasets above from being committed. That worked, and it
        # also hid a real outage: Ramp retired the two optional secondary
        # charts, the gate failed on every run from 2026-08-04 onward, the
        # whole category-charts batch was discarded, and the job still went
        # green. The retired datasets are now marked as such in schemas.py, so
        # a failure here again means something genuinely broke -- let it fail.
        # The commit step below runs on failure anyway, so a red step here no
        # longer costs the datasets that did succeed.
        run: |
          python -m ramp_data.cli --base-dir . category-charts


      - name: Commit normalized datasets
        # Runs even when a scrape step failed: each step gates its own write, so
        # whatever reached disk is trustworthy and worth committing. The job
        # still reports the failure.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/normalized/ramp/*.parquet
          git add data/raw/ramp/*/manifest.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Ramp data changes to commit"
            exit 0
          fi

          git commit -m "chore: update ramp vendor intelligence data [$(date -u +%Y-%m-%d)]"

          # This job is the sole writer of these paths, so a diverged default
          # branch rebases cleanly; retry to absorb a push race with other jobs.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Upload normalized datasets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ramp-vendor-data
          path: data/normalized/ramp/
          if-no-files-found: warn
