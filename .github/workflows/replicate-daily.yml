name: Replicate AI Data Daily

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: replicate-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Collect Replicate datasets
        run: |
          python -m replicate_data.cli --base-dir . scrape --top-models 15

      - name: Commit normalized Replicate datasets
        run: |
          if git diff --quiet -- data/normalized/replicate; then
            echo "No Replicate dataset changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/replicate
          git commit -m "chore: update Replicate datasets [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Package raw response snapshots
        if: always()
        run: |
          if [ -d data/raw/replicate ]; then
            tar -czf "$RUNNER_TEMP/replicate-raw.tar.gz" -C data/raw/replicate .
          fi

      - name: Upload raw snapshots artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: replicate-raw-snapshots
          path: ${{ runner.temp }}/replicate-raw.tar.gz
          if-no-files-found: warn
          retention-days: 7
