name: SEC EDGAR Full-Text Search Daily Update

on:
  schedule:
    - cron: "15 4 * * *"        # 04:15 UTC daily
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write

jobs:
  scrape-sec-edgar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run daily update
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: |
          python -m sec_edgar_data.cli --data-dir .

      - name: Commit normalized datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/normalized/sec_edgar/*.parquet

          if git diff --cached --quiet; then
            echo "No SEC EDGAR data changes to commit"
            exit 0
          fi

          git commit -m "chore: update SEC EDGAR filings dataset [$(date -u +%Y-%m-%d)]"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Upload normalized datasets
        uses: actions/upload-artifact@v4
        with:
          name: sec-edgar-data
          path: data/normalized/sec_edgar/
          if-no-files-found: warn
