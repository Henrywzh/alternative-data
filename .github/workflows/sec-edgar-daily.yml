name: SEC EDGAR Full-Text Search Daily Update

on:
  schedule:
    - cron: "15 4 * * *"        # 04:15 UTC daily
  workflow_dispatch:           # allow manual trigger

concurrency:
  # This job always writes the repository default branch, regardless of the
  # ref selected for a manual dispatch, so all runs must share one lock.
  group: sec-edgar-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-sec-edgar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run daily update
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: |
          python -m sec_edgar_data.cli --data-dir .

      - name: Commit normalized datasets
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/normalized/sec_edgar/edgar_filings.parquet

          if git diff --cached --quiet; then
            echo "No SEC EDGAR data changes to commit"
            exit 0
          fi

          git commit -m "chore: update SEC EDGAR filings dataset [$(date -u +%Y-%m-%d)]"

          target_branch="${{ github.event.repository.default_branch }}"
          echo "Target branch: ${target_branch}"
          git status --short
          git show --stat --oneline --summary HEAD

          for attempt in 1 2 3 4 5; do
            if ! git fetch --prune origin "${target_branch}"; then
              echo "Fetch failed on attempt ${attempt}"
            elif git rebase "origin/${target_branch}"; then
              if git push origin "HEAD:${target_branch}"; then
                echo "Pushed on attempt ${attempt}"
                exit 0
              fi
              echo "Push failed on attempt ${attempt}"
            else
              echo "Rebase failed on attempt ${attempt}; aborting rebase"
              git rebase --abort || true
            fi
            git status --short
            if [ "${attempt}" -lt 5 ]; then
              echo "Retrying in $((attempt * 5)) seconds..."
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

      - name: Upload normalized datasets
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sec-edgar-data
          path: data/normalized/sec_edgar/
          if-no-files-found: warn
