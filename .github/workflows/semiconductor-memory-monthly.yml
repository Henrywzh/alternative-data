name: Semiconductor Memory Monthly

on:
  schedule:
    # ADATA: check first 5 days of each month for new report (idempotent upsert)
    - cron: "0 9 1-5 * *"
    # FRED: mid-month after PPI release (~6-week lag; release typically around 14th)
    - cron: "0 12 14-16 * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: false
        default: "adata-update"
        type: choice
        options:
          - adata-update
          - adata-backfill
          - fred-update
          - derive
          - validate
      month:
        description: "Month (YYYY-MM) for adata-update — leave blank for latest"
        required: false
        default: ""
      start_month:
        description: "Start month (YYYY-MM) for adata-backfill"
        required: false
        default: ""
      end_month:
        description: "End month (YYYY-MM) for adata-backfill"
        required: false
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  adata-update:
    name: ADATA Monthly Update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Run on scheduled trigger (days 1-5) OR manual adata-update/adata-backfill
    if: |
      github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.command == 'adata-update' || github.event.inputs.command == 'adata-backfill')
      || (github.event_name == 'schedule' && contains(github.event.schedule, '1-5'))
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run adata-update (scheduled)
        if: github.event_name == 'schedule'
        run: semiconductor-memory-data --base-dir . adata-update

      - name: Run adata-update (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'adata-update'
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month ${{ github.event.inputs.month }}"
          fi
          semiconductor-memory-data --base-dir . adata-update $MONTH_ARG

      - name: Run adata-backfill (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'adata-backfill'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start_month }}" ]; then
            ARGS="$ARGS --start-month ${{ github.event.inputs.start_month }}"
          fi
          if [ -n "${{ github.event.inputs.end_month }}" ]; then
            ARGS="$ARGS --end-month ${{ github.event.inputs.end_month }}"
          fi
          semiconductor-memory-data --base-dir . adata-backfill $ARGS

      - name: Rebuild derived table
        run: semiconductor-memory-data --base-dir . derive

      - name: Validate
        run: semiconductor-memory-data --base-dir . validate

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/semiconductor_memory 'data/raw/semiconductor_memory/**/manifest.json'
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: update semiconductor memory datasets"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - uses: actions/upload-artifact@v7
        with:
          name: semiconductor-memory-normalized-adata
          path: data/normalized/semiconductor_memory/
          if-no-files-found: warn

      - name: Fetch previous Phase 0 baseline
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ops/fetch_baseline.py \
            --artifact-prefix ops-shadow-semiconductor-memory-adata- \
            --output /tmp/ops-baseline-semiconductor-memory-adata.json

      - name: Emit Phase 0 shadow run report
        if: always()
        continue-on-error: true
        env:
          OPS_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/ops/finalize_pipeline.py \
            --pipeline-id semiconductor-memory-monthly \
            --job-id adata-update \
            --execution "$OPS_JOB_STATUS" \
            --baseline-report /tmp/ops-baseline-semiconductor-memory-adata.json \
            --output artifacts/ops/semiconductor-memory-adata/run-report.json \
            --evidence-output artifacts/ops/semiconductor-memory-adata/evidence-manifest.json

      - name: Ensure Phase 0 fallback telemetry exists
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OPS_PIPELINE_ID: semiconductor-memory-monthly
          OPS_JOB_ID: adata-update
          OPS_JOB_STATUS: ${{ job.status }}
          OPS_REPORT_PATH: artifacts/ops/semiconductor-memory-adata/run-report.json
          OPS_EVIDENCE_PATH: artifacts/ops/semiconductor-memory-adata/evidence-manifest.json
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const reportPath = process.env.OPS_REPORT_PATH;
            const observedAt = new Date().toISOString();
            const runId = process.env.GITHUB_RUN_ID || `fallback-${observedAt}`;
            const runUrl = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY
              ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}` : null;
            const allowed = new Set(["success", "failure", "cancelled"]);
            const execution = allowed.has(process.env.OPS_JOB_STATUS) ? process.env.OPS_JOB_STATUS : "unknown";
            const message = "Repository finalizer was unavailable; emitted runner-level fallback telemetry.";
            const required = ["pipeline_id", "job_id", "run_id", "finished_at", "execution",
              "collection", "data_health", "publication", "evidence_quality", "derived_state",
              "checks", "outputs", "evidence"];
            let report = null;
            try {
              const candidate = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              if (candidate.schema_version !== 1 || candidate.shadow !== true
                  || required.some((key) => !(key in candidate))
                  || !Array.isArray(candidate.checks) || !Array.isArray(candidate.outputs)
                  || !Array.isArray(candidate.evidence)) throw new Error("invalid run report");
              report = candidate;
            } catch {}
            if (!report) {
              const evidence = [{kind: "finalizer-error", path: null, observed_at: observedAt,
                description: message, run_url: runUrl, commit_sha: process.env.GITHUB_SHA || "unknown",
                check_id: "ops-shadow-finalizer", references: runUrl ? [runUrl] : []}];
              report = {
                schema_version: 1, pipeline_id: process.env.OPS_PIPELINE_ID,
                job_id: process.env.OPS_JOB_ID, workflow: process.env.GITHUB_WORKFLOW || "unknown",
                run_id: runId, run_attempt: Math.max(Number(process.env.GITHUB_RUN_ATTEMPT) || 1, 1),
                commit_sha: process.env.GITHUB_SHA || "unknown", started_at: null,
                finished_at: observedAt, execution, collection: "unknown", data_health: "unknown",
                publication: "failed", evidence_quality: "incomplete",
                derived_state: "UNKNOWN_EVIDENCE",
                checks: [{check_id: "ops-shadow-finalizer", status: "unknown", required: true,
                  message, expected: null, observed: null, details: {}}],
                outputs: [], evidence, shadow: true
              };
              fs.mkdirSync(path.dirname(reportPath), {recursive: true});
              fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + "\n");
            }
            const manifest = {version: 1, pipeline_id: report.pipeline_id, job_id: report.job_id,
              run_id: report.run_id, run_url: runUrl, commit_sha: report.commit_sha,
              observed_at: report.finished_at, evidence: report.evidence};
            let manifestValid = false;
            try {
              const existing = JSON.parse(fs.readFileSync(process.env.OPS_EVIDENCE_PATH, "utf8"));
              manifestValid = existing.version === 1 && existing.pipeline_id === report.pipeline_id
                && existing.job_id === report.job_id && existing.run_id === report.run_id
                && Array.isArray(existing.evidence);
            } catch {}
            if (!manifestValid) {
              fs.mkdirSync(path.dirname(process.env.OPS_EVIDENCE_PATH), {recursive: true});
              fs.writeFileSync(process.env.OPS_EVIDENCE_PATH, JSON.stringify(manifest, null, 2) + "\n");
            }

      - name: Upload Phase 0 shadow telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ops-shadow-semiconductor-memory-adata-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ops/semiconductor-memory-adata/
          if-no-files-found: warn
          retention-days: 30

  fred-update:
    name: FRED PPI Update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Run on scheduled trigger (days 14-16) OR manual fred-update
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'fred-update'
      || (github.event_name == 'schedule' && contains(github.event.schedule, '14-16'))
    env:
      FRED_API_KEY: ${{ secrets.SEMICONDUCTOR_FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run fred-update
        run: semiconductor-memory-data --base-dir . fred-update

      - name: Rebuild derived table
        run: semiconductor-memory-data --base-dir . derive

      - name: Validate
        run: semiconductor-memory-data --base-dir . validate

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/semiconductor_memory 'data/raw/semiconductor_memory/**/manifest.json'
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: update semiconductor memory datasets"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - uses: actions/upload-artifact@v7
        with:
          name: semiconductor-memory-normalized-fred
          path: data/normalized/semiconductor_memory/
          if-no-files-found: warn

      - name: Fetch previous Phase 0 baseline
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ops/fetch_baseline.py \
            --artifact-prefix ops-shadow-semiconductor-memory-fred- \
            --output /tmp/ops-baseline-semiconductor-memory-fred.json

      - name: Emit Phase 0 shadow run report
        if: always()
        continue-on-error: true
        env:
          OPS_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/ops/finalize_pipeline.py \
            --pipeline-id semiconductor-memory-monthly \
            --job-id fred-update \
            --execution "$OPS_JOB_STATUS" \
            --baseline-report /tmp/ops-baseline-semiconductor-memory-fred.json \
            --output artifacts/ops/semiconductor-memory-fred/run-report.json \
            --evidence-output artifacts/ops/semiconductor-memory-fred/evidence-manifest.json

      - name: Ensure Phase 0 fallback telemetry exists
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OPS_PIPELINE_ID: semiconductor-memory-monthly
          OPS_JOB_ID: fred-update
          OPS_JOB_STATUS: ${{ job.status }}
          OPS_REPORT_PATH: artifacts/ops/semiconductor-memory-fred/run-report.json
          OPS_EVIDENCE_PATH: artifacts/ops/semiconductor-memory-fred/evidence-manifest.json
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const reportPath = process.env.OPS_REPORT_PATH;
            const observedAt = new Date().toISOString();
            const runId = process.env.GITHUB_RUN_ID || `fallback-${observedAt}`;
            const runUrl = process.env.GITHUB_SERVER_URL && process.env.GITHUB_REPOSITORY
              ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}` : null;
            const allowed = new Set(["success", "failure", "cancelled"]);
            const execution = allowed.has(process.env.OPS_JOB_STATUS) ? process.env.OPS_JOB_STATUS : "unknown";
            const message = "Repository finalizer was unavailable; emitted runner-level fallback telemetry.";
            const required = ["pipeline_id", "job_id", "run_id", "finished_at", "execution",
              "collection", "data_health", "publication", "evidence_quality", "derived_state",
              "checks", "outputs", "evidence"];
            let report = null;
            try {
