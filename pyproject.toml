[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-alternative-data"
version = "0.1.0"
description = "OpenRouter rankings ingestion pipeline for alternative data research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "playwright>=1.52",
  "pyarrow>=16.0.0",
  "pdfplumber>=0.11",
  "requests>=2.32",
  "streamlit>=1.56.0",
  "plotly>=5.24",
  "matplotlib>=3.8",
  "akshare>=1.18.40",
  "yfinance>=0.2.54",
  "trendspyg>=0.6.1",
]

[tool.poetry]
package-mode = false

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0.2",
  "pytest>=8.2",
  "pytest-xdist>=3.6",
]

[project.scripts]
openrouter-data = "openrouter_data.cli:main"
openrouter-official-data = "openrouter_official_data.cli:main"
openrouter-derived-data = "openrouter_derived_data.cli:main"
github-trending-data = "github_trending_data.cli:main"
provider-adoption-data = "provider_adoption_data.cli:main"
semiconductor-memory-data = "semiconductor_memory_data.cli:main"
compute-availability-data = "compute_availability_data.cli:main"
llm-benchmark-data = "llm_benchmark_data.cli:main"
research-data = "research_data.cli:main"
artificial-analysis-data = "artificial_analysis_data.cli:main"
minerals-usgs-data = "minerals_usgs_data.cli:main"
minerals-signal-data = "minerals_signal_data.cli:main"
taiwan-semiconductor-revenue-data = "taiwan_semiconductor_revenue_data.cli:main"
semiconductor-proxy-data = "semiconductor_proxy_data.cli:main"
semiconductor-high-frequency-data = "semiconductor_high_frequency_data.cli:main"
google-trends-data = "google_trends_data.cli:main"
google-trends-watchlist = "google_trends_data.batch_cli:main"
vercel-ai-data = "vercel_ai_data.cli:main"
ramp-data = "ramp_data.cli:main"
ofr-macro-data = "ofr_macro_data.cli:main"
global-news-data = "global_news_data.cli:main"
provider-incident-data = "provider_incident_data.cli:main"
ai-hiring-data = "ai_hiring_data.cli:main"
fred-macro-data = "fred_macro_data.cli:main"
sec-edgar-data = "sec_edgar_data.cli:main"
ai-news-data = "ai_news_data.cli:main"
ai-news-signal-data = "ai_news_signal_data.cli:main"
hk-local-consumer-data = "hk_local_consumer.cli:main"
hk-labour-market-data = "hk_labour_market.cli:main"
hk-reit-data = "hk_reit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
